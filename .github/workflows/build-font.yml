name: Build JetHan Mono

# JetHan Mono = JetBrains Mono (英文/代码, 优先) + 思源等宽/Noto Sans Mono CJK SC (中文)
#
# 说明: Adobe 思源官方 OFL 声明保留字体名 'Source', JetBrains Mono 无 RFN
# 但 'JetBrains' 为注册商标, 故衍生字体定名 JetHan Mono（中性新名, 合规）。
#
# 触发:
#   - font-build/** 或本工作流变更推送至 main → 自动构建 + 上传产物
#   - 推送 tag jethan-v* (如 jethan-v1.000) → 构建并自动创建 GitHub Release
#   - 手动 workflow_dispatch, 默认 tag jethan-v1.000, 可自定义
#     → 构建并创建 GitHub Release 附带字体文件
#
# 上游字体缓存:
#   JetBrains Mono + Noto CJK 源字体 (~140MB) 存入 actions/cache;
#   key 绑定下方 env 的上游版本号, 升级上游时改 env 即自动换 key 重新下载。

env:
  JB_VERSION: '2.304'   # JetBrains Mono 发布 tag (fetch_sources.sh 与 cache key 共用)
  NOTO_TAG: 'Sans2.004' # notofonts/noto-cjk 发布 tag (Mono 随 Sans 分发)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag 名（默认 jethan-v1.000，构建后自动发布）'
        required: false
        default: 'jethan-v1.000'
  push:
    branches: [main]
    tags: ['jethan-v*']
    paths:
      - 'font-build/**'
      - '.github/workflows/build-font.yml'

permissions:
  contents: read

concurrency:
  group: build-font-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 子集化 → CFF转TTF → 合并 → 校验 (8 字重)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖 (fontTools + brotli + uharfbuzz)
        run: pip install fonttools brotli uharfbuzz

      - name: 恢复上游字体缓存 (JetBrains Mono + Noto CJK, ~140MB)
        id: font-cache
        uses: actions/cache@v4
        with:
          path: font-build/downloads
          # key 绑定上游版本号: 升级 env.JB_VERSION / env.NOTO_TAG 即自动失效重拉
          key: jethan-upstream-jb${{ env.JB_VERSION }}-noto${{ env.NOTO_TAG }}

      - name: 下载上游字体源 (仅缓存未命中时; 脚本幂等, 已存在文件自动跳过)
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: bash font-build/tools/fetch_sources.sh
        env:
          JB_VERSION: ${{ env.JB_VERSION }}
          NOTO_TAG: ${{ env.NOTO_TAG }}

      - name: 上游字体就位确认 (缓存或新下载, 缺文件则失败)
        run: |
          ls -la font-build/downloads/
          for f in JetBrainsMono-{Thin,ExtraLight,Light,Regular,Medium,SemiBold,Bold,ExtraBold}.ttf \
                   JetBrainsMono-OFL.txt \
                   NotoSansMonoCJKsc-{Regular,Bold}.otf \
                   NotoSansCJKsc-{Thin,DemiLight,Light,Regular,Medium,Bold,Black}.otf; do
            test -s "font-build/downloads/$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "上游字体文件齐全 (18 项)"

      - name: 构建 (子集化 → CFF→TTF → CJK 1200u → 合并(Merger API) → 重命名 → woff2 → 校验)
        run: bash font-build/build.sh

      - name: 产物完整性检查 (8 字重 x ttf+woff2 + OFL)
        run: |
          ls -la font-build/output/
          for W in Thin ExtraLight Light Regular Medium SemiBold Bold ExtraBold; do
            test -s font-build/output/JetHanMono-$W.ttf
            test -s font-build/output/JetHanMono-$W.woff2
          done
          test -s font-build/output/JetHanMono-OFL.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: JetHanMono-fonts
          path: |
            font-build/output/JetHanMono-*.ttf
            font-build/output/JetHanMono-*.woff2
            font-build/output/JetHanMono-OFL.txt
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
      || startsWith(github.ref, 'refs/tags/jethan-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: JetHanMono-fonts
          path: dist

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: JetHan Mono ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            JetHan Mono — JetBrains Mono × 思源等宽 拼合字体

            - 英文/代码字形: JetBrains Mono v2.304（优先, 含编程连字 calt）
            - 中文字形: 思源等宽 / Noto Sans Mono CJK SC（CJK 补充, 全宽 1200u = 2×拉丁 600u）
            - 字重: Thin / ExtraLight / Light / Regular / Medium / SemiBold / Bold / ExtraBold 共 8 档
              （CJK 侧无 Heavy/ExtraLight, 按 usWeightClass 就近映射, 最重映射到 Noto Black）
            - 许可: SIL OFL 1.1（思源保留字体名 'Source', 故本衍生字体另取名）
          files: dist/*
          fail_on_unmatched_files: true
