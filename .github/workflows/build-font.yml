name: Build JetHan Mono

# JetHan Mono = JetBrains Mono (英文/代码, 优先) + 思源等宽/Noto Sans Mono CJK SC (中文)
#
# 说明: Adobe 思源官方 OFL 声明保留字体名 'Source', JetBrains Mono 无 RFN
# 但 'JetBrains' 为注册商标, 故衍生字体定名 JetHan Mono（中性新名, 合规）。
#
# 触发:
#   - font-build/** 或本工作流变更推送至 main → build + test 两个 job
#   - 推送 tag jethan-v* (如 jethan-v1.002) → build + test + 自动创建 GitHub Release
#     (test 是发布质量门槛: 测试不通过或被跳过则不发布)
#   - 手动 workflow_dispatch:
#       release_tag: 留空 = 仅构建+测试, 不发布; 填 jethan-vX.YZZ = 通过后发布
#       run_tests:   是否运行测试 job (默认勾选; 取消勾选则本次不会发布)
#
# job 结构:
#   build   分组去重(8字重→6组) → 子集化 → CFF转TTF (共享层, 只跑一次)
#           → 按变体循环 [步进吸附 → 拼合] (centered=不缩放居中 / scaled=x1.2满格)
#           → 改名+woff2 (SKIP_VERIFY=1, JOBS 阶段内并行, 校验拆至 test)
#   test    verify.py 静态度量 + invariant_test.py 全字形 JBM 保真
#           + shape_test.py HarfBuzz 塑形, 双变体 x 8 字重
#           (--verify-only 模式: 下载 build 产物 + 上游缓存作对比基准)
#   release 打包两套方案压缩包并发布:
#           JetHanMono-<版本>-Centered.zip / -Scaled.zip,
#           各含 ttf/ + woff2/ (8 字重) + OFL; 字体内名两套完全一致,
#           散装字体资产不再单独发布 (同名会冲突, 压缩包即“两套字体”)
#
# 上游字体缓存:
#   JetBrains Mono + Noto CJK 源字体 (~140MB) 存入 actions/cache;
#   key 绑定下方 env 的上游版本号, 升级上游时改 env 即自动换 key 重新下载。
#   actions 版本由 dependabot (github-actions 生态, 每周) 自动跟进;
#   当前全部 target node24 (Node 20 已于 2025-09 弃言, 详见 GH changelog)。

env:
  JB_VERSION: '2.304'   # JetBrains Mono 发布 tag (fetch_sources.sh 与 cache key 共用)
  NOTO_TAG: 'Sans2.004' # notofonts/noto-cjk 发布 tag (Mono 随 Sans 分发)
  JOBS: '2'             # build.sh 每阶段并行任务数 (runner 4 vCPU/16GB;
                        # 首次全量构建实测内存峰值后可上调至 3)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag 名（留空 = 仅构建+测试, 不发布）'
        required: false
        default: ''
      run_tests:
        description: '运行测试 job（取消勾选则本次不会发布 Release）'
        type: boolean
        default: true
  push:
    branches: [main]
    tags: ['jethan-v*']
    paths:
      - 'font-build/**'
      - '.github/workflows/build-font.yml'

permissions:
  contents: read

concurrency:
  group: build-font-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 (共享预处理 + centered/scaled 双变体, 8 字重)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖 (fontTools + brotli + uharfbuzz)
        run: pip install fonttools brotli uharfbuzz

      - name: 恢复上游字体缓存 (JetBrains Mono + Noto CJK, ~140MB)
        id: font-cache
        uses: actions/cache@v6
        with:
          path: font-build/downloads
          # key 绑定上游版本号: 升级 env.JB_VERSION / env.NOTO_TAG 即自动失效重拉
          key: jethan-upstream-jb${{ env.JB_VERSION }}-noto${{ env.NOTO_TAG }}

      - name: 下载上游字体源 (仅缓存未命中时; 脚本幂等, 已存在文件自动跳过)
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: bash font-build/tools/fetch_sources.sh
        env:
          JB_VERSION: ${{ env.JB_VERSION }}
          NOTO_TAG: ${{ env.NOTO_TAG }}

      - name: 上游字体就位确认 (缓存或新下载, 缺文件则失败)
        run: |
          ls -la font-build/downloads/
          for f in JetBrainsMono-{Thin,ExtraLight,Light,Regular,Medium,SemiBold,Bold,ExtraBold}.ttf \
                   JetBrainsMono-OFL.txt \
                   NotoSansMonoCJKsc-{Regular,Bold}.otf \
                   NotoSansCJKsc-{Thin,DemiLight,Light,Regular,Medium,Bold,Black}.otf; do
            test -s "font-build/downloads/$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "上游字体文件齐全 (18 项)"

      - name: 恢复中间产物缓存 (subsetted/ converted/ output/; 未变步骤由 build.sh 指纹跳过)
        id: mid-cache
        uses: actions/cache@v6
        with:
          path: |
            font-build/subsetted
            font-build/converted
            font-build/output
          # 精确 key 绑定脚本内容: 任一管线脚本改动 -> miss;
          # restore-keys 前缀兜底恢复最近一份旧产物, build.sh 内部再按
          # 每步的输入 sha256 指纹决定跳过/重跑 —— 改 rename.py 不会
          # 重跑子集化/转换/吸附/拼合, 只有受影响的步骤真正执行。
          key: jethan-mid-v3-jb${{ env.JB_VERSION }}-noto${{ env.NOTO_TAG }}-${{ hashFiles('font-build/build.sh', 'font-build/tools/*.py') }}
          restore-keys: |
            jethan-mid-v3-jb${{ env.JB_VERSION }}-noto${{ env.NOTO_TAG }}-

      - name: 构建 (双变体 + JOBS 阶段内并行 + CJK 预处理去重; 校验拆至 test job)
        run: bash font-build/build.sh
        env:
          SKIP_VERIFY: '1'

      - name: 产物完整性检查 (centered/scaled 各 8 字重 x ttf+woff2 + OFL)
        run: |
          for V in centered scaled; do
            echo "== $V =="
            ls -la font-build/output/$V/
            for W in Thin ExtraLight Light Regular Medium SemiBold Bold ExtraBold; do
              test -s font-build/output/$V/JetHanMono-$W.ttf
              test -s font-build/output/$V/JetHanMono-$W.woff2
            done
            test -s font-build/output/$V/JetHanMono-OFL.txt
          done

      - name: 上传构建产物 (两套变体; 目录结构保留 centered/ scaled/)
        uses: actions/upload-artifact@v7
        with:
          name: JetHanMono-fonts
          path: |
            font-build/output/centered/JetHanMono-*
            font-build/output/scaled/JetHanMono-*
          if-no-files-found: error

      - name: 上传 CJK 中间产物 (test job 的 verify 对比基准, 双变体)
        uses: actions/upload-artifact@v7
        with:
          name: JetHanMono-cjk-converted
          path: |
            font-build/converted/centered/CJK-*.ttf
            !font-build/converted/centered/CJK-*.pre.ttf
            font-build/converted/scaled/CJK-*.ttf
            !font-build/converted/scaled/CJK-*.pre.ttf
          if-no-files-found: error

      - name: 上传构建日志 (失败时便于定位)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: font-build/build-logs/
          if-no-files-found: ignore

  test:
    name: 校验 (verify + JBM 不变量 + HarfBuzz shaping, 双变体 x 8 字重)
    needs: build
    # push / tag 必跑 (发布质量门槛); 手动 dispatch 可取消勾选 (但取消则不发布)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖 (fontTools + brotli + uharfbuzz)
        run: pip install fonttools brotli uharfbuzz

      - name: 恢复上游字体缓存 (verify/shape_test 的对比基准)
        id: font-cache
        uses: actions/cache@v6
        with:
          path: font-build/downloads
          key: jethan-upstream-jb${{ env.JB_VERSION }}-noto${{ env.NOTO_TAG }}

      - name: 下载上游字体源 (仅缓存未命中时)
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: bash font-build/tools/fetch_sources.sh
        env:
          JB_VERSION: ${{ env.JB_VERSION }}
          NOTO_TAG: ${{ env.NOTO_TAG }}

      - name: 下载构建产物 (output/)
        uses: actions/download-artifact@v8
        with:
          name: JetHanMono-fonts
          path: font-build/output

      - name: 下载 CJK 中间产物 (converted/ 下的分组产物)
        uses: actions/download-artifact@v8
        with:
          name: JetHanMono-cjk-converted
          path: font-build/converted

      - name: 校验 (verify-only 模式, 8 字重)
        run: bash font-build/build.sh --verify-only

      - name: 上传校验日志 (失败时便于定位)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: font-build/build-logs/
          if-no-files-found: ignore

  release:
    name: 发布 GitHub Release (双变体压缩包)
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
      || startsWith(github.ref, 'refs/tags/jethan-v')
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载构建产物 (centered/ 与 scaled/ 目录结构随 artifact 保留)
        uses: actions/download-artifact@v8
        with:
          name: JetHanMono-fonts
          path: dist

      - name: 打包两套方案压缩包 (各含 ttf/ + woff2/ + OFL, 文件名带版本号)
        env:
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          VERSION="${TAG#jethan-v}"   # jethan-v1.003 -> 1.003; 前缀不符时原样保留
          for V in centered scaled; do
            VCAP="${V^}"                # Centered / Scaled
            mkdir -p "pkg/$V/ttf" "pkg/$V/woff2"
            cp dist/$V/JetHanMono-*.ttf dist/$V/JetHanMono-OFL.txt "pkg/$V/ttf/"
            cp dist/$V/JetHanMono-*.woff2 dist/$V/JetHanMono-OFL.txt "pkg/$V/woff2/"
            ( cd "pkg/$V" && zip -r "$OLDPWD/dist/JetHanMono-${VERSION}-${VCAP}.zip" \
                ttf woff2 JetHanMono-OFL.txt )
          done
          cp dist/centered/JetHanMono-OFL.txt dist/
          echo "== Release 资产清单 ($VERSION) =="
          ls -la dist/JetHanMono-*.zip dist/JetHanMono-OFL.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          overwrite_files: true  # 同名资产直接替换, 支持 workflow_dispatch 覆盖更新已发布 Release
          name: JetHan Mono ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            JetHan Mono — JetBrains Mono × 思源等宽 拼合字体（居中 / 缩放 双方案）

            自 1.003 起提供两套 CJK 几何方案, **字体内部名称完全一致**（均为 JetHan Mono）,
            按需**二选一**下载安装（同名家族请勿同时安装, 会互相覆盖）:

            - **JetHanMono-<版本>-Centered.zip 居中版（默认 / 推荐）**
              CJK 轮廓不缩放, 保持思源等宽原始 1000u 设计与字面观感（"中"墨高 ~919u）,
              设计盒水平居中于 1200u 全角格; 全部墨迹都在 JBM 纵向度量（1020/-300）之内。
            - **JetHanMono-<版本>-Scaled.zip 缩放版（满格派）**
              CJK 轮廓双轴 ×1.2 放大填满 1200u 全角格（"中"墨高 ~1103u, 比上游高 20%）,
              更接近传统中文字体的字面率; 汉字顶部会略超出拉丁上伸部, 属该方案已知取舍。

            每个压缩包内含 `ttf/` 与 `woff2/` 两个目录（8 字重）+ OFL 许可证, 解压即用。

            - 英文/代码字形: JetBrains Mono v2.304（优先, 含编程连字 calt）
            - 中文字形: 思源等宽 / Noto Sans Mono CJK SC（CJK 补充, 全宽 1200u = 2×拉丁 600u）
            - 字重: Thin / ExtraLight / Light / Regular / Medium / SemiBold / Bold / ExtraBold 共 8 档
              （CJK 侧无 Heavy/ExtraLight, 按 usWeightClass 就近映射, 最重映射到 Noto Black）
            - 两套方案共用同一构建管线与全部质量门槛（verify / JBM 不变量 / HarfBuzz 塑形 / 元数据审计）
            - 元数据完整: fontRevision 与 nameID5 一致、固定发布日、厂商/设计者/许可/URL 齐全、
              ulUnicodeRange 按合并后 cmap 重算（OS/2 vendID 'JHM '）
            - 许可: SIL OFL 1.1（思源保留字体名 'Source', 故本衍生字体另取名）
          files: |
            dist/JetHanMono-*.zip
            dist/JetHanMono-OFL.txt
          fail_on_unmatched_files: true
